[build-system]
build-backend = "setuptools.build_meta"
# Update [project.optional-dependencies.dev] as well when making changes here
requires = [
    "setuptools==84.0.0",
    "build==1.6.1",
    "flake8==7.3.0",
    "sphinx==9.1.0",
    "sphinx-rtd-theme==3.1.0",
]


[project]
name = "pyimpspec"
version = "5.2.0"
license = "GPL-3.0-or-later"
license-files = [
	"LICENSE",
	"COPYRIGHT",
	"CONTRIBUTORS",
	"LICENSES/*.txt",
	"LICENSES/*.md",
]
description = "A package for parsing, validating, analyzing, and simulating impedance spectra."
authors = [
	{name = "pyimpspec developers"},
]
maintainers = [
    {name = "Ville Yrjänä"},
]
requires-python = ">=3.12"
dependencies = [
    "Jinja2 >=3.1, <4",  # Needed when turning pandas.DataFrames instances into, e.g., LaTeX strings.
    "lmfit >=1.3, <2",  # Needed for performing non-linear fitting.
    "matplotlib >=3.11, <4",  # Needed for the plotting module.
    "numdifftools >=0.11, <1",  # Needed for estimating uncertainties during circuit fitting
    "numpy >=2.5, <3",
    "odfpy >= 1.4, <2",  # Needed by pandas for parsing OpenDocument spreadsheet formats.
    "openpyxl >=3.1, <4",  # Needed by pandas for parsing newer Excel files (.xlsx).
    "pandas >=3.0, <4",  # Needed for dealing with various file formats.
    "schemdraw >=0.23, <1",  # Needed to draw circuit diagrams
    "scipy >=1.17, <2",  # Note that 1.18 introduced issues with constrained fitting
    "statsmodels >=0.15, <1",  # Used for smoothing (LOWESS) in Z-HIT
    "sympy >=1.14, <2",  # Used to generate expressions for circuits
    "tabulate >=0.10, <1",  # Required by pandas to generate Markdown tables.
    "xdg-base-dirs >=6.0, <7",
]
readme = "README.md"
classifiers = [
		"Intended Audience :: Science/Research",
		"Operating System :: MacOS",
		"Operating System :: Microsoft :: Windows",
		"Operating System :: POSIX :: Linux",
		"Programming Language :: Python :: 3.12",
		"Programming Language :: Python :: 3.13",
		"Programming Language :: Python :: 3.14",
		"Programming Language :: Python :: 3 :: Only",
		"Topic :: Scientific/Engineering :: Chemistry",
		"Topic :: Scientific/Engineering :: Physics",
		"Topic :: Scientific/Engineering",
]


[project.urls]
homepage = "https://vyrjana.github.io/pyimpspec"
documentation = "https://vyrjana.github.io/pyimpspec"
source = "https://github.com/vyrjana/pyimpspec"
tracker = "https://github.com/vyrjana/pyimpspec/issues"
install = "https://vyrjana.github.io/pyimpspec/guide_installing.html"
releasenotes = "https://github.com/vyrjana/pyimpspec/blob/main/CHANGELOG.md"


[project.scripts]
pyimpspec = "pyimpspec.cli:main"


[project.optional-dependencies]
cvxopt = ["cvxopt >=1.3, <2"]
kvxopt = ["kvxopt >=1.3, <2"]
dev = [
    "setuptools==84.0.0",
    "build==1.6.1",
    "flake8==7.3.0",
    "sphinx==9.1.0",
    "sphinx-rtd-theme==3.1.0",
]


[tool.setuptools.packages.find]
where = ["src"]
